{{/* giscus 评论系统组件 */}}
<div class="giscus-comments">
  <script src="https://giscus.app/client.js"
          data-repo="JasperStonnne/MyBlog"
          data-repo-id="R_kgDOSbdzNw"
          data-category="Announcements"
          data-category-id="DIC_kwDOSbdzN84C84Gl"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="preferred_color_scheme"
          data-lang="zh-CN"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>

  {{/* 深浅模式同步 */}}
  <script>
    (function() {
      function sync() {
        const iframe = document.querySelector('iframe.giscus-frame');
        if (iframe) {
          iframe.contentWindow.postMessage({
            giscus: { setConfig: { theme: document.documentElement.classList.contains('dark') ? 'dark_dimmed' : 'light' } }
          }, 'https://giscus.app');
        }
      }
      new MutationObserver(() => sync()).observe(document.documentElement, {
        attributes: true, attributeFilter: ['class']
      });
      window.addEventListener('message', (e) => {
        if (e.origin === 'https://giscus.app' && e.data?.giscus?.discussion) sync();
      });
    })();
  </script>
</div>
