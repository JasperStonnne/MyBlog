    <text x="0" y="118" fill="#f8fafc" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="61" font-weight="800" letter-spacing="-1">KV 进化（二）</text>
    <text x="0" y="190" fill="#f8fafc" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="57" font-weight="800" letter-spacing="-1">快照与 AOF</text>
    <rect x="0" y="216" width="72" height="5" rx="2.5" fill="url(#glow)"/>

    <text x="0" y="274" fill="#94a3b8" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21">全量基线连接增量恢复</text>
    <text x="0" y="307" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="0.6">snapshot · offset · replay · recovery</text>

    <g transform="translate(0 364)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">
      <rect width="64" height="30" rx="8" fill="#34d399" fill-opacity="0.11"/>
      <text x="32" y="20" text-anchor="middle" fill="#6ee7b7">SNAP</text>
