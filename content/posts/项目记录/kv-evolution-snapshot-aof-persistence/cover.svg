  <text x="76" y="590" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.4">C LANGUAGE · SNAPSHOT · AOF · OFFSET · CRASH RECOVERY</text>
