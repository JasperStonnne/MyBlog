      <path d="M0 18H128" stroke="#22d3ee" stroke-width="2"/>
      <path d="M128 0V18L166 9" fill="none" stroke="#818cf8" stroke-width="2"/>
      <path d="M158 2L167 9L158 16" fill="none" stroke="#818cf8" stroke-width="2"/>
      <rect x="184" y="-17" width="274" height="52" rx="13" fill="#818cf8" fill-opacity="0.10" stroke="#818cf8" stroke-opacity="0.28"/>
      <circle cx="207" cy="9" r="5" fill="#818cf8"/>
      <text x="225" y="6" fill="#c7d2fe" font-size="14" font-weight="800">MEMORY RESTORED</text>
      <text x="225" y="24" fill="#64748b" font-size="12">snapshot + AOF tail</text>
