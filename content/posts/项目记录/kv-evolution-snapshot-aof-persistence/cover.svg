      <rect x="0" y="32" width="458" height="70" rx="14" fill="#0f1c2e" stroke="#24364d"/>
      <circle cx="24" cy="67" r="5" fill="#22d3ee"/>
      <text x="42" y="63" fill="#67e8f9" font-size="14" font-weight="800">appendonly.aof</text>
