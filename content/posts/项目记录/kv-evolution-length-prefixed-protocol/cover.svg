<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">KV 进化（六）：命令协议改造</title>
  <desc id="desc">长度前缀命令帧将 SET、含空格的 key 和 value 分别编码，解析后保留字段边界。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#94a3b8" opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="970" cy="320" r="360" fill="url(#halo)"/>
  <path d="M0 0H1200V7H0Z" fill="url(#glow)"/>

  <g transform="translate(76 72)">
    <rect width="180" height="34" rx="17" fill="#5eead4" fill-opacity="0.10" stroke="#5eead4" stroke-opacity="0.35"/>
    <circle cx="20" cy="17" r="4" fill="#5eead4"/>
    <text x="34" y="23" fill="#99f6e4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="1.8">KV STORE · 06</text>

    <text x="0" y="118" fill="#f8fafc" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="61" font-weight="800" letter-spacing="-1">KV 进化（六）</text>
    <text x="0" y="190" fill="#f8fafc" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="55" font-weight="800" letter-spacing="-1">命令协议改造</text>
    <rect x="0" y="216" width="72" height="5" rx="2.5" fill="url(#glow)"/>

    <text x="0" y="274" fill="#94a3b8" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21">长度前缀，守住每个字段的边界</text>
    <text x="0" y="307" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="0.6">frame · parse · persist · replicate</text>

    <g transform="translate(0 364)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">
      <rect width="58" height="30" rx="8" fill="#34d399" fill-opacity="0.11"/>
      <text x="29" y="20" text-anchor="middle" fill="#6ee7b7">RESP</text>
      <rect x="68" width="64" height="30" rx="8" fill="#22d3ee" fill-opacity="0.10"/>
      <text x="100" y="20" text-anchor="middle" fill="#67e8f9">FRAME</text>
      <rect x="142" width="58" height="30" rx="8" fill="#818cf8" fill-opacity="0.11"/>
      <text x="171" y="20" text-anchor="middle" fill="#a5b4fc">AOF</text>
      <rect x="210" width="58" height="30" rx="8" fill="#f472b6" fill-opacity="0.10"/>
      <text x="239" y="20" text-anchor="middle" fill="#f9a8d4">SYNC</text>
    </g>
  </g>

  <g transform="translate(590 74)" filter="url(#shadow)">
    <rect width="526" height="482" rx="30" fill="#0b1424" stroke="#334155" stroke-opacity="0.72"/>
    <rect x="1" y="1" width="524" height="63" rx="29" fill="#111d30"/>
    <circle cx="31" cy="32" r="5" fill="#fb7185"/>
    <circle cx="50" cy="32" r="5" fill="#fbbf24"/>
    <circle cx="69" cy="32" r="5" fill="#34d399"/>
    <text x="101" y="38" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">protocol / codec.c</text>

    <g transform="translate(34 87)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="0" y="16" fill="#475569" font-size="12" font-weight="700" letter-spacing="1.7">LENGTH-PREFIXED FRAME</text>
      <rect x="0" y="32" width="458" height="188" rx="14" fill="#0f1c2e" stroke="#24364d"/>
      <text x="20" y="67" fill="#6ee7b7" font-size="18" font-weight="800">*3</text>
      <text x="70" y="67" fill="#64748b" font-size="13">fields</text>
      <path d="M19 79H439" stroke="#24364d"/>
      <text x="20" y="108" fill="#6ee7b7" font-size="17" font-weight="800">$3</text>
      <text x="84" y="108" fill="#f8fafc" font-size="17">SET</text>
      <text x="20" y="148" fill="#67e8f9" font-size="17" font-weight="800">$9</text>
      <text x="84" y="148" fill="#f8fafc" font-size="17">user name</text>
      <text x="20" y="188" fill="#a5b4fc" font-size="17" font-weight="800">$11</text>
      <text x="84" y="188" fill="#f8fafc" font-size="17">hello world</text>
      <text x="323" y="198" fill="#475569" font-size="12">bytes, not words</text>
    </g>

    <g transform="translate(34 330)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <path d="M0 0H458" stroke="#334155" stroke-width="2"/>
      <circle cx="18" cy="0" r="5" fill="#5eead4"/>
      <path d="M230 0V26" stroke="#818cf8" stroke-width="2"/>
      <path d="M223 19L230 27L237 19" fill="none" stroke="#818cf8" stroke-width="2"/>
      <text x="0" y="60" fill="#475569" font-size="12" font-weight="700" letter-spacing="1.7">PARSED FIELDS</text>
      <rect x="0" y="74" width="96" height="43" rx="10" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.25"/>
      <text x="48" y="101" text-anchor="middle" fill="#6ee7b7" font-size="15" font-weight="700">SET</text>
      <rect x="108" y="74" width="158" height="43" rx="10" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.25"/>
      <text x="187" y="101" text-anchor="middle" fill="#67e8f9" font-size="15">user name</text>
      <rect x="278" y="74" width="180" height="43" rx="10" fill="#818cf8" fill-opacity="0.10" stroke="#818cf8" stroke-opacity="0.25"/>
      <text x="368" y="101" text-anchor="middle" fill="#c7d2fe" font-size="15">hello world</text>
    </g>
  </g>

  <text x="76" y="590" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.4">C LANGUAGE · LENGTH PREFIX · DYNAMIC BUFFER · AOF · REPLICATION</text>
</svg>
