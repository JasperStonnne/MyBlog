<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#94a3b8" opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="970" cy="320" r="360" fill="url(#halo)"/>
  <path d="M0 0H1200V7H0Z" fill="url(#glow)"/>

  <!-- Editorial title block: shared KV series layout -->
  <g transform="translate(76 72)">
    <rect width="180" height="34" rx="17" fill="#5eead4" fill-opacity="0.10" stroke="#5eead4" stroke-opacity="0.35"/>
    <circle cx="20" cy="17" r="4" fill="#5eead4"/>
    <text x="34" y="23" fill="#99f6e4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="1.8">KV STORE · 01</text>

    <text x="0" y="118" fill="#f8fafc" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="61" font-weight="800" letter-spacing="-1">网络层</text>
    <text x="0" y="190" fill="#f8fafc" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="61" font-weight="800" letter-spacing="-1">多模型接入</text>
    <rect x="0" y="216" width="72" height="5" rx="2.5" fill="url(#glow)"/>

    <text x="0" y="274" fill="#94a3b8" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21">统一协议回调连接三种网络模型</text>
    <text x="0" y="307" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="0.6">epoll · io_uring · coroutine</text>

    <g transform="translate(0 364)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">
      <rect width="92" height="30" rx="8" fill="#34d399" fill-opacity="0.11"/>
      <text x="46" y="20" text-anchor="middle" fill="#6ee7b7">REACTOR</text>
      <rect x="102" width="100" height="30" rx="8" fill="#22d3ee" fill-opacity="0.10"/>
      <text x="152" y="20" text-anchor="middle" fill="#67e8f9">PROACTOR</text>
      <rect x="212" width="74" height="30" rx="8" fill="#818cf8" fill-opacity="0.11"/>
      <text x="249" y="20" text-anchor="middle" fill="#a5b4fc">NTYCO</text>
    </g>
  </g>

  <!-- Unified network model panel -->
  <g transform="translate(590 74)" filter="url(#shadow)">
    <rect width="526" height="482" rx="30" fill="#0b1424" stroke="#334155" stroke-opacity="0.72"/>
    <rect x="1" y="1" width="524" height="63" rx="29" fill="#111d30"/>
    <circle cx="31" cy="32" r="5" fill="#fb7185"/>
    <circle cx="50" cy="32" r="5" fill="#fbbf24"/>
    <circle cx="69" cy="32" r="5" fill="#34d399"/>
    <text x="101" y="38" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">network / kvstore.c</text>

    <!-- Shared protocol callback -->
    <g transform="translate(34 89)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="0" y="18" fill="#475569" font-size="12" font-weight="700" letter-spacing="1.7">SHARED CALLBACK</text>
      <rect x="0" y="34" width="458" height="70" rx="14" fill="#0f1c2e" stroke="#24364d"/>
      <circle cx="27" cy="69" r="6" fill="#5eead4"/>
      <text x="48" y="65" fill="#e2e8f0" font-size="15" font-weight="700">msg_handler</text>
      <text x="48" y="86" fill="#67e8f9" font-size="13">kvs_protocol(msg, length, response)</text>
      <path d="M375 69H425" stroke="#818cf8" stroke-width="2"/>
      <path d="M418 62L426 69L418 76" fill="none" stroke="#818cf8" stroke-width="2"/>
    </g>

    <!-- Fan-out connector -->
    <g transform="translate(34 218)">
      <circle cx="229" cy="4" r="5" fill="#5eead4"/>
      <path d="M229 9V31M71 31H387M71 31V49M229 31V49M387 31V49" fill="none" stroke="#334155" stroke-width="2"/>
      <circle cx="71" cy="49" r="4" fill="#34d399"/>
      <circle cx="229" cy="49" r="4" fill="#22d3ee"/>
      <circle cx="387" cy="49" r="4" fill="#818cf8"/>
    </g>

    <!-- Three interchangeable network implementations -->
    <g transform="translate(34 286)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="0" y="14" fill="#475569" font-size="12" font-weight="700" letter-spacing="1.7">NETWORK IMPLEMENTATIONS</text>

      <rect x="0" y="31" width="142" height="116" rx="14" fill="#0f1c2e" stroke="#24364d"/>
      <circle cx="21" cy="54" r="5" fill="#34d399"/>
      <text x="35" y="59" fill="#6ee7b7" font-size="13" font-weight="800">REACTOR</text>
      <text x="16" y="88" fill="#e2e8f0" font-size="16">epoll</text>
      <text x="16" y="116" fill="#64748b" font-size="12">event driven</text>

      <rect x="158" y="31" width="142" height="116" rx="14" fill="#0f1c2e" stroke="#24364d"/>
      <circle cx="179" cy="54" r="5" fill="#22d3ee"/>
      <text x="193" y="59" fill="#67e8f9" font-size="13" font-weight="800">PROACTOR</text>
      <text x="174" y="88" fill="#e2e8f0" font-size="16">io_uring</text>
      <text x="174" y="116" fill="#64748b" font-size="12">completion</text>

      <rect x="316" y="31" width="142" height="116" rx="14" fill="#0f1c2e" stroke="#24364d"/>
      <circle cx="337" cy="54" r="5" fill="#818cf8"/>
      <text x="351" y="59" fill="#a5b4fc" font-size="13" font-weight="800">COROUTINE</text>
      <text x="332" y="88" fill="#e2e8f0" font-size="16">ntyco</text>
      <text x="332" y="116" fill="#64748b" font-size="12">cooperative</text>
    </g>
  </g>

  <text x="76" y="590" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.4">C LANGUAGE · TCP · REACTOR · PROACTOR · COROUTINE</text>
</svg>
