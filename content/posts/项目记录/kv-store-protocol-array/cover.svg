<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#94a3b8" opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="970" cy="320" r="360" fill="url(#halo)"/>
  <path d="M0 0H1200V7H0Z" fill="url(#glow)"/>

  <!-- Editorial title block -->
  <g transform="translate(76 72)">
    <rect width="180" height="34" rx="17" fill="#5eead4" fill-opacity="0.10" stroke="#5eead4" stroke-opacity="0.35"/>
    <circle cx="20" cy="17" r="4" fill="#5eead4"/>
    <text x="34" y="23" fill="#99f6e4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="1.8">KV STORE · 02</text>

    <text x="0" y="118" fill="#f8fafc" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="61" font-weight="800" letter-spacing="-1">协议层与</text>
    <text x="0" y="190" fill="#f8fafc" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="61" font-weight="800" letter-spacing="-1">数组存储</text>
    <rect x="0" y="216" width="72" height="5" rx="2.5" fill="url(#glow)"/>

    <text x="0" y="274" fill="#94a3b8" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21">从文本命令到 key-value</text>
    <text x="0" y="307" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="0.6">split · filter · dispatch · CRUD</text>

    <g transform="translate(0 364)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">
      <rect width="58" height="30" rx="8" fill="#34d399" fill-opacity="0.11"/>
      <text x="29" y="20" text-anchor="middle" fill="#6ee7b7">SET</text>
      <rect x="68" width="58" height="30" rx="8" fill="#22d3ee" fill-opacity="0.10"/>
      <text x="97" y="20" text-anchor="middle" fill="#67e8f9">GET</text>
      <rect x="136" width="58" height="30" rx="8" fill="#818cf8" fill-opacity="0.11"/>
      <text x="165" y="20" text-anchor="middle" fill="#a5b4fc">DEL</text>
      <rect x="204" width="58" height="30" rx="8" fill="#f472b6" fill-opacity="0.10"/>
      <text x="233" y="20" text-anchor="middle" fill="#f9a8d4">MOD</text>
    </g>
  </g>

  <!-- Abstract protocol-to-array visual -->
  <g transform="translate(590 74)" filter="url(#shadow)">
    <rect width="526" height="482" rx="30" fill="#0b1424" stroke="#334155" stroke-opacity="0.72"/>
    <rect x="1" y="1" width="524" height="63" rx="29" fill="#111d30"/>
    <circle cx="31" cy="32" r="5" fill="#fb7185"/>
    <circle cx="50" cy="32" r="5" fill="#fbbf24"/>
    <circle cx="69" cy="32" r="5" fill="#34d399"/>
    <text x="101" y="38" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">protocol / kvstore.c</text>

    <!-- Command tokens -->
    <g transform="translate(34 92)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="0" y="18" fill="#475569" font-size="12" font-weight="700" letter-spacing="1.7">REQUEST</text>
      <rect x="0" y="34" width="458" height="64" rx="14" fill="#0f1c2e" stroke="#24364d"/>
      <rect x="15" y="49" width="68" height="34" rx="9" fill="#34d399" fill-opacity="0.14"/>
      <text x="49" y="71" text-anchor="middle" fill="#6ee7b7" font-size="15" font-weight="800">SET</text>
      <rect x="93" y="49" width="104" height="34" rx="9" fill="#22d3ee" fill-opacity="0.11"/>
      <text x="145" y="71" text-anchor="middle" fill="#67e8f9" font-size="15">course</text>
      <rect x="207" y="49" width="145" height="34" rx="9" fill="#818cf8" fill-opacity="0.12"/>
      <text x="279.5" y="71" text-anchor="middle" fill="#c7d2fe" font-size="15">networking</text>
      <text x="401" y="71" text-anchor="middle" fill="#475569" font-size="17">↵</text>
    </g>

    <!-- Processing line -->
    <g transform="translate(34 222)">
      <circle cx="10" cy="10" r="5" fill="#5eead4"/>
      <line x1="28" y1="10" x2="430" y2="10" stroke="#334155" stroke-width="2"/>
      <circle cx="448" cy="10" r="5" fill="#818cf8"/>
      <text x="0" y="43" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">tokens[ ]</text>
      <text x="365" y="43" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">global_array</text>
    </g>

    <!-- Array rows -->
    <g transform="translate(34 292)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="0" y="14" fill="#475569" font-size="12" font-weight="700" letter-spacing="1.7">ARRAY ENGINE</text>
      <rect x="0" y="31" width="458" height="58" rx="13" fill="#0f1c2e" stroke="#24364d"/>
      <text x="18" y="66" fill="#475569" font-size="13">00</text>
      <text x="62" y="66" fill="#67e8f9" font-size="15">course</text>
      <text x="183" y="66" fill="#334155" font-size="16">→</text>
      <text x="221" y="66" fill="#c7d2fe" font-size="15">networking</text>
      <circle cx="430" cy="60" r="5" fill="#34d399"/>

      <rect x="0" y="99" width="458" height="58" rx="13" fill="#0c1829" stroke="#1e3046"/>
      <text x="18" y="134" fill="#475569" font-size="13">01</text>
      <text x="62" y="134" fill="#64748b" font-size="15">status</text>
      <text x="183" y="134" fill="#334155" font-size="16">→</text>
      <text x="221" y="134" fill="#64748b" font-size="15">OK</text>
      <circle cx="430" cy="128" r="5" fill="#334155"/>
    </g>
  </g>

  <text x="76" y="590" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.4">C LANGUAGE · CUSTOM PROTOCOL · DATA STRUCTURE</text>
</svg>
