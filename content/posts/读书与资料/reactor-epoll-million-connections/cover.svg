<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Reactor 与 epoll：百万并发网络服务器</title>
  <desc id="desc">epoll 事件循环将大量连接上的读写事件分发给 Reactor 回调。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#24143D"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="85" r="250" fill="#8B5CF6" opacity=".12"/>
  <circle cx="875" cy="650" r="300" fill="#14B8A6" opacity=".08"/>
  <path d="M0 0h1200v18H0z" fill="#F59E0B"/>
  <path d="M0 18h1200v5H0z" fill="#FB7185"/>

  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="78" y="142" fill="#FBBF24" font-size="23" font-weight="700" letter-spacing="3">LINUX NETWORK PROGRAMMING</text>
    <text x="76" y="244" fill="#FFFFFF" font-size="65" font-weight="800">Reactor 与 epoll</text>
    <text x="78" y="326" fill="#DDD6FE" font-size="44" font-weight="700">百万并发网络服务器</text>
    <text x="79" y="398" fill="#A7F3D0" font-size="24" font-weight="500">event loop · callback · connection state</text>
    <path d="M79 471h455" stroke="#F59E0B" stroke-width="9" stroke-linecap="round"/>
    <text x="79" y="526" fill="#FDA4AF" font-size="22" font-weight="700">COURSE NOTES · JASPER SAO</text>
  </g>

  <g transform="translate(690 95)" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <rect width="425" height="490" rx="28" fill="#0B1020" stroke="#8B5CF6" stroke-opacity=".75" stroke-width="2"/>
    <text x="32" y="48" fill="#A78BFA" font-size="17" font-weight="700" letter-spacing="2">EPOLL EVENT LOOP</text>

    <g fill="#172033" stroke="#5EEAD4" stroke-width="2">
      <rect x="30" y="82" width="106" height="48" rx="10"/>
      <rect x="30" y="156" width="106" height="48" rx="10"/>
      <rect x="30" y="230" width="106" height="48" rx="10"/>
      <rect x="30" y="304" width="106" height="48" rx="10"/>
    </g>
    <g fill="#CCFBF1" font-size="16" font-weight="700" text-anchor="middle">
      <text x="83" y="112">listenfd</text>
      <text x="83" y="186">clientfd</text>
      <text x="83" y="260">clientfd</text>
      <text x="83" y="334">··· 1M</text>
    </g>

    <path d="M138 106h70M138 180h70M138 254h70M138 328h70" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
    <path d="M196 96l14 10-14 10M196 170l14 10-14 10M196 244l14 10-14 10M196 318l14 10-14 10" fill="none" stroke="#FBBF24" stroke-width="3"/>

    <circle cx="270" cy="217" r="72" fill="#351D50" stroke="#FB7185" stroke-width="4" filter="url(#glow)"/>
    <circle cx="270" cy="217" r="49" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <text x="270" y="211" fill="#FFFFFF" font-size="19" font-weight="800" text-anchor="middle">Reactor</text>
    <text x="270" y="237" fill="#FDA4AF" font-size="13" font-weight="600" text-anchor="middle">dispatch</text>

    <path d="M340 181h50M342 217h48M340 253h50" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"/>
    <g fill="#A7F3D0" font-size="14" font-weight="700">
      <text x="350" y="169">accept</text>
      <text x="358" y="209">recv</text>
      <text x="356" y="281">send</text>
    </g>

    <path d="M30 390h365" stroke="#374151" stroke-width="2"/>
    <text x="212" y="432" fill="#C4B5FD" font-size="16" font-weight="600" text-anchor="middle">fd + event → callback</text>
    <text x="212" y="462" fill="#6EE7B7" font-size="15" text-anchor="middle">EPOLLIN ⇄ EPOLLOUT</text>
  </g>
</svg>
