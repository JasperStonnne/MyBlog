<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">bpftrace 入门指北</title>
  <desc id="desc">探针、挂点与 TCP 观测实战。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="250" fill="#22D3EE" opacity=".10"/>
  <circle cx="820" cy="640" r="280" fill="#A78BFA" opacity=".10"/>
  <path d="M0 0h1200v18H0z" fill="#22D3EE"/>
  <path d="M0 18h1200v5H0z" fill="#F472B6"/>

  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="86" y="145" fill="#67E8F9" font-size="24" font-weight="700" letter-spacing="3">LINUX OBSERVABILITY</text>
    <text x="82" y="250" fill="#FFFFFF" font-size="72" font-weight="800">bpftrace</text>
    <text x="84" y="330" fill="#E9D5FF" font-size="52" font-weight="700">入门指北</text>
    <text x="86" y="405" fill="#A5F3FC" font-size="24" font-weight="500">probe · filter · action · TCP life</text>
    <path d="M86 476h380" stroke="#22D3EE" stroke-width="9" stroke-linecap="round"/>
    <text x="86" y="530" fill="#F9A8D4" font-size="22" font-weight="700">JASPER SAO · BACKEND NOTES</text>
  </g>

  <g transform="translate(700 150)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" filter="url(#glow)">
    <rect x="0" y="0" width="420" height="360" rx="18" fill="#0B1220" stroke="#334155" stroke-width="2"/>
    <text x="28" y="48" fill="#67E8F9" font-size="20">kprobe:tcp_set_state</text>
    <text x="28" y="92" fill="#94A3B8" font-size="18">{</text>
    <text x="44" y="132" fill="#E2E8F0" font-size="18">@birth[$sk] = nsecs;</text>
    <text x="44" y="172" fill="#E2E8F0" font-size="18">$ms = (nsecs -</text>
    <text x="68" y="208" fill="#E2E8F0" font-size="18">@birth[$sk]) / 1000000;</text>
    <text x="44" y="252" fill="#F472B6" font-size="18">delete(@birth[$sk]);</text>
    <text x="28" y="300" fill="#94A3B8" font-size="18">}</text>
    <text x="28" y="340" fill="#A78BFA" font-size="16"># TCP lifetime</text>
  </g>
</svg>
