<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">协程设计原理：从异步回调到 ucontext 调度</title>
  <desc id="desc">调度器通过 yield、resume 和上下文切换管理多个用户态协程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171329"/>
      <stop offset="1" stop-color="#251A3D"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="85" r="245" fill="#7C3AED" opacity=".12"/>
  <circle cx="870" cy="650" r="285" fill="#14B8A6" opacity=".08"/>
  <path d="M0 0h1200v18H0z" fill="#F59E0B"/>
  <path d="M0 18h1200v5H0z" fill="#FB7185"/>

  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="86" y="145" fill="#FBBF24" font-size="24" font-weight="700" letter-spacing="3">USER-SPACE COROUTINES</text>
    <text x="82" y="242" fill="#FFFFFF" font-size="65" font-weight="800">协程设计原理</text>
    <text x="84" y="325" fill="#DDD6FE" font-size="43" font-weight="700">从异步回调到 ucontext 调度</text>
    <text x="86" y="400" fill="#A7F3D0" font-size="24" font-weight="500">context · stack · yield · resume</text>
    <path d="M86 476h410" stroke="#F59E0B" stroke-width="9" stroke-linecap="round"/>
    <text x="86" y="530" fill="#FDA4AF" font-size="22" font-weight="700">JASPER SAO · BACKEND NOTES</text>
  </g>

  <g transform="translate(648 100)" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <rect width="468" height="474" rx="28" fill="#100D20" stroke="#8B5CF6" stroke-opacity=".7" stroke-width="2"/>
    <text x="34" y="49" fill="#A78BFA" font-size="18" font-weight="700" letter-spacing="2">SCHEDULER</text>

    <circle cx="234" cy="216" r="70" fill="#3B1F55" stroke="#FB7185" stroke-width="4" filter="url(#glow)"/>
    <circle cx="234" cy="216" r="47" fill="#171329" stroke="#F59E0B" stroke-width="2"/>
    <text x="234" y="210" fill="#FFFFFF" font-size="20" font-weight="800" text-anchor="middle">main_ctx</text>
    <text x="234" y="237" fill="#FDA4AF" font-size="14" font-weight="600" text-anchor="middle">schedule</text>

    <g font-size="16" font-weight="700" text-anchor="middle">
      <rect x="35" y="82" width="128" height="54" rx="12" fill="#2A2143" stroke="#C4B5FD"/>
      <text x="99" y="115" fill="#EDE9FE">ctx[0]</text>
      <rect x="305" y="82" width="128" height="54" rx="12" fill="#123B3A" stroke="#5EEAD4"/>
      <text x="369" y="115" fill="#CCFBF1">ctx[1]</text>
      <rect x="170" y="342" width="128" height="54" rx="12" fill="#3A2A15" stroke="#FBBF24"/>
      <text x="234" y="375" fill="#FEF3C7">ctx[2]</text>
    </g>

    <path d="M164 132l38 42M304 132l-38 42M234 287v50" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"/>
    <path d="M190 162l13 13-18 2M278 162l-13 13 18 2M224 325l10 13 10-13" fill="none" stroke="#5EEAD4" stroke-width="3"/>
    <path d="M188 200l-43-47M280 200l43-47M213 291v31" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>

    <text x="65" y="178" fill="#A7F3D0" font-size="14">resume</text>
    <text x="344" y="178" fill="#FBBF24" font-size="14">yield</text>
    <path d="M34 420h400" stroke="#4C3F67" stroke-width="2"/>
    <text x="234" y="453" fill="#8B83A7" font-size="16" text-anchor="middle">保存当前上下文 → 恢复目标上下文</text>
  </g>
</svg>
