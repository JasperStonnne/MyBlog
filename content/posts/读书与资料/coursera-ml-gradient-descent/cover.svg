  <rect x="376" y="458" width="172" height="54" fill="#312F3A" stroke="#E96B5C" stroke-width="2"/>
  <text x="138" y="494" text-anchor="middle" fill="#FFFFFF" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="800">导数</text>
  <text x="290" y="494" text-anchor="middle" fill="#FFFFFF" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="800">学习率</text>
  <text x="462" y="494" text-anchor="middle" fill="#FFFFFF" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="800">同步更新</text>

