<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">机器学习基础：用梯度下降法训练模型</title>
  <desc id="desc">A machine learning note cover showing gradient descent moving down a cost-function curve.</desc>
  <rect width="1200" height="675" fill="#17242A"/>
  <rect x="636" y="92" width="564" height="583" fill="#20313A"/>
  <rect width="1200" height="84" fill="#F4C95D"/>
  <rect y="84" width="1200" height="8" fill="#E96B5C"/>
  <text x="72" y="58" fill="#17242A" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="800">MACHINE LEARNING · COURSERA NOTES</text>

  <text x="72" y="182" fill="#FFFFFF" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="52" font-weight="800">梯度下降训练</text>
  <text x="72" y="230" fill="#75D5C3" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700">GRADIENT DESCENT</text>
  <text x="72" y="316" fill="#FFFFFF" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="33" font-weight="800">w := w − α ∂J/∂w</text>
  <text x="72" y="370" fill="#DCE9E7" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="600">理解导数、学习率、收敛与参数更新</text>

