<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">IOCP Windows 异步机制</title>
  <desc id="desc">完成端口、异步请求与工作线程的抽象示意图</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07192f"/>
      <stop offset="1" stop-color="#123e63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#7cdecb"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="none" stroke="#5fb7dd" stroke-opacity=".18">
    <path d="M0 110h1200M0 220h1200M0 330h1200M0 440h1200M0 550h1200"/>
    <path d="M120 0v630M300 0v630M480 0v630M660 0v630M840 0v630M1020 0v630"/>
  </g>
  <g transform="translate(760 110)">
    <rect x="0" y="130" width="250" height="140" rx="28" fill="#0c2945" stroke="url(#accent)" stroke-width="4"/>
    <text x="125" y="190" text-anchor="middle" fill="#e8f6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="700">Completion</text>
    <text x="125" y="229" text-anchor="middle" fill="#77d8ed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27">Port</text>
    <g fill="#7cdecb" filter="url(#glow)">
      <circle cx="-112" cy="75" r="12"/><circle cx="-112" cy="200" r="12"/><circle cx="-112" cy="325" r="12"/>
      <circle cx="362" cy="75" r="12"/><circle cx="362" cy="200" r="12"/><circle cx="362" cy="325" r="12"/>
    </g>
    <g stroke="#77d8ed" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M-100 75H-30q30 0 30 30v40"/><path d="M-100 200H0"/><path d="M-100 325H-30q30 0 30-30v-40"/>
      <path d="M250 145v-40q0-30 30-30h70"/><path d="M250 200h100"/><path d="M250 255v40q0 30 30 30h70"/>
    </g>
    <g fill="#d7f4ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
      <text x="-250" y="82">AcceptEx</text><text x="-250" y="207">WSARecv</text><text x="-250" y="332">WSASend</text>
      <text x="390" y="82">Worker 1</text><text x="390" y="207">Worker 2</text><text x="390" y="332">Worker N</text>
    </g>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="78" y="178" fill="#7cdecb" font-size="30" font-weight="650" letter-spacing="5">WINDOWS ASYNC I/O</text>
    <text x="74" y="278" fill="#ffffff" font-size="104" font-weight="800">IOCP</text>
    <text x="80" y="354" fill="#d5e9f5" font-size="42" font-weight="600">完成通知，而非就绪通知</text>
    <rect x="80" y="399" width="526" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="80" y="459" fill="#8fb9d0" font-size="27">CompletionKey · OVERLAPPED · Thread Pool</text>
  </g>
</svg>
