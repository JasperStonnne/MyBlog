<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">IO 多路复用与 Reactor</title>
  <desc id="desc">select、poll 和 epoll 将就绪事件交给 Reactor，再分发到 accept、read 和 write 回调。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171329"/>
      <stop offset="1" stop-color="#251A3D"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1100" cy="90" r="245" fill="#7C3AED" opacity=".11"/>
  <circle cx="870" cy="650" r="285" fill="#14B8A6" opacity=".08"/>
  <path d="M0 0h1200v18H0z" fill="#F59E0B"/>
  <path d="M0 18h1200v5H0z" fill="#FB7185"/>

  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="86" y="160" fill="#FBBF24" font-size="24" font-weight="700" letter-spacing="3">LINUX NETWORK PROGRAMMING</text>
    <text x="82" y="260" fill="#FFFFFF" font-size="68" font-weight="800">IO 多路复用</text>
    <text x="84" y="344" fill="#DDD6FE" font-size="52" font-weight="650">与 Reactor</text>
    <text x="86" y="415" fill="#A7F3D0" font-size="25" font-weight="500">select · poll · epoll · event dispatch</text>
    <path d="M86 488h410" stroke="#F59E0B" stroke-width="9" stroke-linecap="round"/>
    <text x="86" y="542" fill="#FDA4AF" font-size="22" font-weight="700">JASPER SAO · BACKEND NOTES</text>
  </g>

  <g transform="translate(625 106)" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <rect width="486" height="468" rx="28" fill="#100D20" stroke="#8B5CF6" stroke-opacity=".7" stroke-width="2"/>
    <text x="38" y="48" fill="#A78BFA" font-size="18" font-weight="700" letter-spacing="2">EVENT LOOP</text>

    <g font-size="17" font-weight="700" text-anchor="middle">
      <rect x="34" y="87" width="112" height="48" rx="10" fill="#2A2143" stroke="#C4B5FD"/>
      <text x="90" y="117" fill="#EDE9FE">select</text>
      <rect x="34" y="157" width="112" height="48" rx="10" fill="#2A2143" stroke="#C4B5FD"/>
      <text x="90" y="187" fill="#EDE9FE">poll</text>
      <rect x="34" y="227" width="112" height="48" rx="10" fill="#2A2143" stroke="#C4B5FD"/>
      <text x="90" y="257" fill="#EDE9FE">epoll</text>
    </g>

    <path d="M147 111h55M147 181h55M147 251h55" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
    <path d="M191 101l13 10-13 10M191 171l13 10-13 10M191 241l13 10-13 10" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linejoin="round"/>

    <circle cx="275" cy="181" r="72" fill="#3B1F55" stroke="#FB7185" stroke-width="4" filter="url(#glow)"/>
    <circle cx="275" cy="181" r="48" fill="#171329" stroke="#F59E0B" stroke-width="2"/>
    <text x="275" y="176" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">Reactor</text>
    <text x="275" y="202" fill="#FDA4AF" font-size="14" font-weight="600" text-anchor="middle">dispatch</text>

    <path d="M348 181h64M336 132l76-28M336 230l76 28" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"/>
    <path d="M401 171l13 10-13 10M400 96l14 6-8 13M406 247l8 13-14 6" fill="none" stroke="#5EEAD4" stroke-width="3" stroke-linejoin="round"/>

    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="362" y="72" width="92" height="39" rx="9" fill="#123B3A" stroke="#5EEAD4"/>
      <text x="408" y="97" fill="#CCFBF1">accept</text>
      <rect x="380" y="162" width="80" height="39" rx="9" fill="#123B3A" stroke="#5EEAD4"/>
      <text x="420" y="187" fill="#CCFBF1">read</text>
      <rect x="362" y="251" width="92" height="39" rx="9" fill="#123B3A" stroke="#5EEAD4"/>
      <text x="408" y="276" fill="#CCFBF1">write</text>
    </g>

    <path d="M38 328h410" stroke="#4C3F67" stroke-width="2"/>
    <g font-size="15" font-weight="600">
      <circle cx="59" cy="370" r="8" fill="#F59E0B"/>
      <text x="78" y="376" fill="#D8B4FE">注册关注事件</text>
      <circle cx="212" cy="370" r="8" fill="#FB7185"/>
      <text x="231" y="376" fill="#D8B4FE">等待就绪事件</text>
      <circle cx="365" cy="370" r="8" fill="#5EEAD4"/>
      <text x="384" y="376" fill="#D8B4FE">执行回调</text>
    </g>
    <text x="243" y="427" fill="#8B83A7" font-size="17" text-anchor="middle">关注 fd → 获取 ready → 分发 callback</text>
  </g>
</svg>
