baseURL: https://jasperstonnne.github.io/MyBlog/
locale: zh-cn
title: JasperSao的博客
theme: github.com/nunocoracao/blowfish/v3

defaultContentLanguage: zh-cn
hasCJKLanguage: true
timeZone: Asia/Shanghai
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
summaryLength: 0

pagination:
  pagerSize: 10

frontmatter:
  date: [date, :fileModTime]
  lastmod: [lastmod, :fileModTime]

outputs:
  home: [HTML, RSS, JSON]

taxonomies:
  tag: tags
  category: categories

permalinks:
  posts: /p/:slug/
  page: /:slug/

privacy:
  vimeo:
    enableDNT: true
  x:
    enableDNT: true
  youTube:
    privacyEnhanced: true

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["\\[", "\\]"], ["$$", "$$"]]
          inline: [["\\(", "\\)"]]
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 2

related:
  threshold: 0
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 80
    - name: date
      weight: 10

module:
  imports:
    - path: github.com/nunocoracao/blowfish/v3

params:
  mainSections: [posts]
  description: Jasper 的系统与网络编程笔记，记录 C/C++、Go、Linux、网络与项目实践。
  colorScheme: ocean
  defaultAppearance: light
  autoSwitchAppearance: true
  enableSearch: true
  enableCodeCopy: true
  enableImageLazyLoading: true
  disableImageZoom: true
  enableStyledScrollbar: false
  backgroundCanvas: false
  smartTOC: true
  smartTOCHideUnfocusedChildren: true
  fingerprintAlgorithm: sha256

  header:
    layout: basic
    mobileMenuStyle: dropdown

  footer:
    showMenu: true
    showCopyright: true
    showThemeAttribution: false
    showAppearanceSwitcher: true
    showScrollToTop: true

  homepage:
    layout: profile
    showRecent: true
    showRecentItems: 6
    showMoreLink: true
    showMoreLinkDest: posts
    cardView: true
    cardViewScreenWidth: false
    layoutBackgroundBlur: false
    homepageImage: ""

  article:
    showDate: true
    showDateUpdated: true
    showAuthor: false
    showHero: true
    heroStyle: basic
    layoutBackgroundBlur: false
    showBreadcrumbs: true
    showDraftLabel: true
    showEdit: false
    showHeadingAnchors: true
    showPagination: true
    invertPagination: false
    showReadingTime: true
    showTableOfContents: true
    showTaxonomies: true
    showWordCount: true
    showComments: true
    showSummary: true
    showRelatedContent: true
    relatedContentLimit: 3
    showZenMode: false
    showReadingProgress: false
    sharingLinks: [email]

  list:
    showHero: false
    showBreadcrumbs: true
    showSummary: true
    showTableOfContents: false
    showCards: true
    groupByYear: false
    cardView: false
    layoutBackgroundBlur: false

  taxonomy:
    showTermCount: true
    showHero: false
    showBreadcrumbs: true
    cardView: false
    layoutBackgroundBlur: false

  term:
    showHero: false
    showBreadcrumbs: true
    showTableOfContents: false
    groupByYear: false
    cardView: false
    layoutBackgroundBlur: false

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 10
    - identifier: projects
      name: 项目
      url: /projects/
      weight: 20
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 30
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 40
    - identifier: links
      name: 友链
      url: /links/
      weight: 50
    - identifier: about
      name: 关于
      url: /about/
      weight: 60

languages:
  zh-cn:
    disabled: false
    locale: zh-CN
    label: 简体中文
    title: JasperSao的博客
    weight: 1
    params:
      displayName: 中文
      isoCode: zh-CN
      dateFormat: 2006年1月2日
      description: Jasper 的系统与网络编程笔记，记录 C/C++、Go、Linux、网络与项目实践。
      author:
        name: JasperSao
        image: img/sidebar/avatar-square.jpg
        headline: 系统与网络编程 · C/C++ · Go
        bio: 山东大学 2029 届本科生，记录项目、学习与思考。
        links:
          - github: https://github.com/JasperStonnne
          - email: mailto:shijingyuan061010@gmail.com
          - link: https://linux.do/u/jaspersao/summary
