baseURL: https://jaspersao.github.io/
locale: zh-cn
title: "JasperSao的博客"
theme: github.com/hugo-toha/toha/v4

# 基础设置
defaultContentLanguage: zh-cn
timeZone: Asia/Shanghai
enableRobotsTXT: true
enableGitInfo: true

# 分页
pagination:
  pagerSize: 10

# Front matter
frontmatter:
  date: ["date", ":fileModTime"]
  lastmod: ["lastmod", ":fileModTime"]

# 输出格式
outputs:
  home: ["HTML", "RSS"]

# 隐私设置
privacy:
  vimeo:
    enableDNT: true
  x:
    enableDNT: true
  youTube:
    privacyEnhanced: true

# Markdown 渲染
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["\\[", "\\]"], ["$$", "$$"]]
          inline: [["\\(", "\\)"]]
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

# Toha 主题模块
module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    - source: static/files
      target: static/files
    - source: ./node_modules/flag-icons/flags
      target: static/flags
    - source: ./node_modules/@fontsource/mulish/files
      target: static/files
    - source: ./node_modules/katex/dist/fonts
      target: static/fonts

# 主题参数
params:
  logo: {}
  gitRepo: https://github.com/JasperStonnne/JasperStonnne.github.io
  gitBranch: main

  features:
    # 主题切换
    theme:
      enable: true
      services:
        light: true
        dark: true
        default: system
    # Portfolio 首页
    portfolio:
      enable: true
    # 博客功能
    blog:
      enable: true
      # 文章页设置
      excerptLength: 20
      showShareButtons: true
      showPagination: true
      showReadingTime: true
    # 搜索
    search:
      enable: true
    # 代码高亮
    highlight:
      enable: true
      # 代码复制按钮
      copyCode: true
    # KaTeX 数学公式
    kaTeX:
      enable: true
    # Mermaid 图表
    mermaid:
      enable: true
    # 评论系统
    comments:
      enable: true
      giscus:
        repo: JasperStonnne/MyBlog
        repoId: ""
        category: "Announcements"
        categoryId: ""
        mapping: pathname
        strict: 0
        reactionsEnabled: 1
        emitMetadata: 0
        inputPosition: top
        lightTheme: light
        darkTheme: dark
        lang: zh-CN

# 多语言配置
languages:
  zh-cn:
    locale: zh-cn
    label: 简体中文
    title: "JasperSao的博客"
    weight: 1
