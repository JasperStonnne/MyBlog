baseURL: https://jasperstonnne.github.io/MyBlog/
locale: zh-cn
title: JasperSao的博客
theme: github.com/CaiJimmy/hugo-theme-stack/v4

defaultContentLanguage: zh-cn
hasCJKLanguage: true
timeZone: Asia/Shanghai
enableRobotsTXT: true
enableGitInfo: true

pagination:
  pagerSize: 10

frontmatter:
  date: ["date", ":fileModTime"]
  lastmod: ["lastmod", ":fileModTime"]

outputs:
  home: ["HTML", "RSS"]

permalinks:
  posts: /p/:slug/
  page: /:slug/

privacy:
  vimeo:
    enableDNT: true
  x:
    enableDNT: true
  youTube:
    privacyEnhanced: true

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["\\[", "\\]"], ["$$", "$$"]]
          inline: [["\\(", "\\)"]]
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

module:
  imports:
    - path: github.com/CaiJimmy/hugo-theme-stack/v4

params:
  mainSections:
    - posts
  rssFullContent: true
  favicon: favicon.ico
  gitRepo: https://github.com/JasperStonnne/MyBlog
  gitBranch: main

  footer:
    since: 2026
    customText: ""

  dateFormat:
    published: 2006年1月2日
    lastUpdated: 2006年1月2日

  sidebar:
    emoji: "🧬"
    subtitle: 我走了很远的路才来到你面前
    avatar: img/sidebar/avatar-square.jpg

  article:
    headingAnchor: false
    math: true
    readingTime: true
    license:
      enabled: false

  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 20
    page:
      - type: toc

  colorScheme:
    toggle: true
    default: auto

  comments:
    enabled: true
    provider: giscus
    giscus:
      repo: JasperStonnne/MyBlog
      repoID: R_kgDOSbdzNw
      category: Announcements
      categoryID: DIC_kwDOSbdzN84C84Gl
      mapping: pathname
      strict: 0
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: bottom
      lightTheme: light
      darkTheme: dark_dimmed
      lang: zh-CN
      loading: lazy

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 10
      params:
        icon: home
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
      params:
        icon: archives
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30
      params:
        icon: search
    - identifier: links
      name: 友链
      url: /links/
      weight: 40
      params:
        icon: link
    - identifier: about
      name: 关于
      url: /about/
      weight: 50
      params:
        icon: user

  social:
    - identifier: github
      name: GitHub
      url: https://github.com/JasperStonnne
      params:
        icon: brand-github
    - identifier: email
      name: Email
      url: mailto:shijingyuan061010@gmail.com
      params:
        icon: link
    - identifier: linuxdo
      name: Linux.do
      url: https://linux.do/u/jaspersao/summary
      params:
        icon: link

languages:
  zh-cn:
    locale: zh-cn
    label: 简体中文
    title: JasperSao的博客
    weight: 1
